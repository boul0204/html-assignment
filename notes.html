<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Darien's SillySite</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center; 
    }

    header {
      display: flex;                
      justify-content: space-between; 
      align-items: center;
      padding: 20px;
      background-color: #efc6c6;
    }

    header h1 {
      margin: 0;
      padding: 10px 20px;
      border: 3px solid #631111;    
      border-radius: 8px;
      background-color: #fff0f0;    
      color: #631111;
    }

    nav a {
      margin-left: 15px;
      text-decoration: none;
      font-weight: bold;
      color: #631111;
    }

    nav a:hover {
      color: #ff8a4f;
    }

    
    .learning-title {
      text-align: center;
      margin-top: 20px;
    }

    
    table {
      margin: 20px auto;           
      border-collapse: collapse;
      width: 60%;
    }
    caption {
      font-weight: bold;
      margin-bottom: 10px;
    }
    th, td {
      border: 1px solid #631111;
      padding: 8px 12px;
      text-align: left;           
    }
    th {
      background-color: #ffdad6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Darien's SillySite!</h1>
    <nav>
      <a href="index.html">Home</a>

  </header>

  <h1 class="learning-title">HTML Learning!</h1>

  <table>
    <caption>What I've learned</caption>
    <thead>
      <tr>
        <th>Tags</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><strong>div</strong></td>
        <td>generic container for grouping content without semantic meaning</td>
      </tr>
      <tr>
        <td><strong>strong</strong></td>
        <td>important text, bolds text</td>
      </tr>
      <tr>
        <td><strong>sub</strong></td>
        <td>lowered text (H₂O)</td>
      </tr>
      <tr>
        <td><strong>sup</strong></td>
        <td>raised text 29ᵗʰ</td>
      </tr>
      <tr>
        <td><strong>h1-h4</strong></td>
        <td>headings from most to least importance</td>
      </tr>
    </tbody>
  </table>
